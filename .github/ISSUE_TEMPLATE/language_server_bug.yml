name: Bug Report - Language Server
about: Report a bug for the Language Server
title: "[Bug][Language Server]: "
labels: [ "bug", "language-server" ]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: The version number of the Language Server (or commit hash)
    validations:
      required: true
  - type: input
    id: branch
    attributes:
      label: Branch
      description: The branch name you are currently using
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
