name: LSP Crate Build

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/lsp-build.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/lsp-build.yml'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        rust: [ stable ]
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v5
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v5
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --verbose

      - name: Run tests
        shell: bash
        run: |
          mkdir -p target/test-results
          set -o pipefail
          cargo test --message-format=json | cargo2junit > target/test-results/cargo-test-results.xml

      - name: Publish Rust test dashboard
        uses: ctrf-io/github-test-reporter@v1
        with:
          report-path: 'target/test-results/*.xml'
          summary-report: true
          failed-report: true
          test-report: true
          insights-report: true
          status-check: true
          upload-artifact: true
          report-order: 'summary-report,failed-report,insights-report,test-report'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: always()

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Run clippy
        run: cargo clippy -- -D warnings

      - name: Create archive
        run: |
          mkdir -p artifacts
          tar -czf artifacts/trainz-language-server-${{ matrix.os }}-${{ github.sha }}.tar.gz target/debug/trainz-language-server target/debug/trainz-fmt
        if: success()

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lsp-build-${{ matrix.os }}
          path: artifacts/
          retention-days: 30
        if: success()
