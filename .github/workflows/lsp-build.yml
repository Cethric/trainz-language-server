name: LSP Crate Build

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/lsp-build.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/lsp-build.yml'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-26-intel, windows-latest, windows-11-arm ]
        rust: [ stable ]
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v5
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v5
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --profile release

      - uses: taiki-e/install-action@nextest

      - name: Run tests
        shell: bash
        run: |
          cargo nextest run --profile ci --tests --max-fail=all --no-pager --no-tests warn


      - name: Publish Test Report
        uses: ctrf-io/github-test-reporter@v1
        with:
          report-path: 'target/nextest/ci/junit.xml'
          integrations-config: |
            {
              "junit-to-ctrf": {
                "enabled": true,
                "action": "convert",
                "options": {
                  "output": "target/nextest/ci/junit.json",
                  "toolname": "junit-to-ctrf",
                  "useSuiteName": false,
                  "env": {
                    "appName": "my-app"
                  }
                }
              }
            }
        if: always()
      - name: Publish Rust test dashboard
        uses: ctrf-io/github-test-reporter@v1
        with:
          report-path: 'target/nextest/ci/junit.json'
          summary-report: true
          failed-report: true
          test-report: true
          insights-report: true
          status-check: true
          upload-artifact: true
          report-order: 'summary-report,failed-report,insights-report,test-report'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: always()

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Run clippy
        run: cargo clippy -- -D warnings

      - name: Create archive
        run: |
          mkdir -p artifacts
          tar -czf artifacts/trainz-language-server-${{ matrix.os }}-${{ github.sha }}.tar.gz target/release/trainz-language-server target/release/trainz-fmt
        if: success() && (matrix.os != 'windows-latest' || matrix.os != 'windows-11-arm')

      - name: Create archive
        run: |
          mkdir -p artifacts
          7z a -t7z artifacts/trainz-language-server-${{ matrix.os }}-${{ github.sha }}.7z target/release/trainz-language-server.exe target/release/trainz-fmt.exe
        if: success() && (matrix.os == 'windows-latest' || matrix.os == 'windows-11-arm')

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lsp-build-${{ matrix.os }}
          path: artifacts/
          retention-days: 30
        if: success()
