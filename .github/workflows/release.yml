name: Semantic Release

on:
  push:
    branches: [ main, develop ]

concurrency: release

jobs:
  build-language-server:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        rust: [ stable ]
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v5
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v5
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --profile release

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Run clippy
        run: cargo clippy -- -D warnings

      - name: Create archive
        run: |
          mkdir -p artifacts
          tar -czf artifacts/trainz-language-server-${{ matrix.os }}-${{ github.sha }}.tar.gz target/release/trainz-language-server target/release/trainz-fmt
        if: success() && matrix.os != 'windows-latest'

      - name: Create archive
        run: |
          mkdir -p artifacts
          tar -czf artifacts/trainz-language-server-${{ matrix.os }}-${{ github.sha }}.tar.gz target/release/trainz-language-server.exe target/release/trainz-fmt.exe
        if: success() && matrix.os == 'windows-latest'

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lsp-build-${{ matrix.os }}
          path: artifacts/
          retention-days: 30
        if: success()

  build-jetbrains-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true

      - name: Set up JDK 24
        uses: actions/setup-java@v5
        with:
          java-version: '24'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3

      - name: Grant execute permission for gradlew
        run: chmod +x extensions/trainz-idea/gradlew

      - name: Build with Gradle
        run: ./gradlew build
        working-directory: extensions/trainz-idea

      - name: Verify plugin
        run: ./gradlew verifyPlugin
        working-directory: extensions/trainz-idea
        continue-on-error: true

      - name: Create archive
        run: |
          mkdir -p artifacts
          tar -czf artifacts/trainz-idea-${{ github.sha }}.tar.gz build/distributions/
        working-directory: extensions/trainz-idea
        if: always()

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jetbrains-build
          path: extensions/trainz-idea/artifacts/
          retention-days: 30
        if: always()

  build-vscode-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: 'extensions/vscode/pnpm-lock.yaml'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: extensions/vscode

      - name: Build
        run: pnpm compile
        working-directory: extensions/vscode

      - name: Lint
        run: pnpm lint
        working-directory: extensions/vscode
        continue-on-error: true

      - name: Create archive
        run: |
          mkdir -p artifacts
          tar -czf artifacts/trainz-language-server-vscode-node22-${{ github.sha }}.tar.gz out/
        working-directory: extensions/vscode
        if: success()

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vscode-build-${{ matrix.os }}-node${{ matrix.node }}
          path: extensions/vscode/artifacts/
          retention-days: 30
        if: success()

  release:
    needs: [ build-language-server, build-jetbrains-plugin, build-vscode-extension ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-save

      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: release-artifacts

      - name: Organize artifacts
        run: |
          mkdir -p final-artifacts
          find release-artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec cp {} final-artifacts/ \;
          ls -la final-artifacts/

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

      - name: Upload final artifacts as run artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-binaries-and-extensions
          path: final-artifacts/
          retention-days: 90
