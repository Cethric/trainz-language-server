name: Semantic Release

on:
  push:
    branches: [ main, develop ]

concurrency: release

jobs:
  prepare-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.final-version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Calculate Version
        id: version
        uses: PaulHatch/semantic-version@v6.0.2
        with:
          tag_prefix: "v"
          search_commit_body: true
          enable_prerelease_mode: true

      - name: Determine Final Version
        id: final-version
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if [[ "${{ github.ref_name }}" == "develop" ]]; then
            # The semantic-version action outputs increment
            VERSION="${VERSION}-dev.${{ steps.version.outputs.increment }}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Cancel if Unchanged
        if: ${{ ! fromJSON(steps.version.outputs.changed) }}
        run: |
          gh run cancel ${{ github.run_id }}
          gh run watch ${{ github.run_id }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-language-server:
    needs: [ prepare-version ]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-26-intel, windows-latest, windows-11-arm ]
        rust: [ stable ]
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v5
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v5
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Update Version
        run: |
          node scripts/update-root-versions.js ${{ needs.prepare-version.outputs.version }}
          node scripts/update-all-crates.js ${{ needs.prepare-version.outputs.version }}

      - name: Build
        run: cargo build --profile release

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Run clippy
        run: cargo clippy -- -D warnings

      - name: Create archive
        run: |
          mkdir -p artifacts
          tar -czf artifacts/trainz-language-server-${{ matrix.os }}-${{ github.sha }}.tar.gz target/release/trainz-language-server target/release/trainz-fmt
        if: success() && (matrix.os != 'windows-latest' && matrix.os != 'windows-11-arm')

      - name: Create archive
        run: |
          mkdir -p artifacts
          7z a -t7z artifacts/trainz-language-server-${{ matrix.os }}-${{ github.sha }}.7z target/release/*.exe
        if: success() && (matrix.os == 'windows-latest' || matrix.os == 'windows-11-arm')

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lsp-build-${{ matrix.os }}
          path: artifacts/
          retention-days: 30
        if: success()

  build-jetbrains-plugin:
    needs: [ prepare-version ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Update Version
        run: |
          node scripts/update-root-versions.js ${{ needs.prepare-version.outputs.version }}
          node scripts/update-extension-version.js trainz-idea ${{ needs.prepare-version.outputs.version }}

      - name: Set up JDK 24
        uses: actions/setup-java@v5
        with:
          java-version: '24'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3

      - name: Grant execute permission for gradlew
        run: chmod +x extensions/trainz-idea/gradlew

      - name: Build with Gradle
        run: ./gradlew build
        working-directory: extensions/trainz-idea

      - name: Verify plugin
        run: ./gradlew verifyPlugin
        working-directory: extensions/trainz-idea
        continue-on-error: true

      - name: Create archive
        run: |
          mkdir -p artifacts
          tar -czf artifacts/trainz-idea-${{ github.sha }}.tar.gz build/distributions/
        working-directory: extensions/trainz-idea
        if: always()

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jetbrains-build
          path: extensions/trainz-idea/artifacts/
          retention-days: 30
        if: always()

  build-vscode-extension:
    needs: [ prepare-version ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Update Version
        run: |
          node scripts/update-root-versions.js ${{ needs.prepare-version.outputs.version }}
          node scripts/update-extension-version.js vscode ${{ needs.prepare-version.outputs.version }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: 'extensions/vscode/pnpm-lock.yaml'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: extensions/vscode

      - name: Build
        run: pnpm run package
        working-directory: extensions/vscode

      - name: Lint
        run: pnpm lint
        working-directory: extensions/vscode
        continue-on-error: true

      - name: Create archive
        run: |
          mkdir -p artifacts
          npx @vscode/vsce package --no-dependencies
          mv *.vsix artifacts/
        working-directory: extensions/vscode
        if: success()

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vscode-build
          path: extensions/vscode/artifacts/
          retention-days: 30
        if: success()

  build-lsp4ij:
    needs: [ prepare-version ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true

      - name: Create archive
        run: |
          mkdir -p artifacts
          tar -czf artifacts/trainz-lsp4ij-${{ github.sha }}.tar.gz -C extensions/lsp4ij .

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lsp4ij-build
          path: artifacts/
          retention-days: 30
        if: success()

  release:
    needs: [ prepare-version, build-language-server, build-jetbrains-plugin, build-vscode-extension, build-lsp4ij ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: release-artifacts

      - name: Organize artifacts
        run: |
          mkdir -p final-artifacts
          find release-artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" -o -name "*.7z" -o -name "*.vsix" \) -exec cp {} final-artifacts/ \;
          ls -la final-artifacts/

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git tag v${{ needs.prepare-version.outputs.version }}
          git push origin v${{ needs.prepare-version.outputs.version }}
          ARGS='--generate-notes --latest --discussion-category "General" --fail-on-no-commits'
          if [[ "${{ github.ref_name }}" == "develop" ]]; then
            ARGS='--prerelease --fail-on-no-commits'
          fi

          gh release create v${{ needs.prepare-version.outputs.version }} --generate-notes --discussion-category "General" $ARGS final-artifacts/*

      - name: Upload final artifacts as run artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-binaries-and-extensions
          path: final-artifacts/
          retention-days: 90
