name: JetBrains Extension Build

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'extensions/trainz-idea/**'
      - '.github/workflows/jetbrains-extension-build.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'extensions/trainz-idea/**'
      - '.github/workflows/jetbrains-extension-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 24
        uses: actions/setup-java@v4
        with:
          java-version: '24'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3

      - name: Grant execute permission for gradlew
        run: chmod +x extensions/trainz-idea/gradlew

      - name: Build with Gradle
        run: ./gradlew build
        working-directory: extensions/trainz-idea

      - name: Verify plugin
        run: ./gradlew verifyPlugin
        working-directory: extensions/trainz-idea
        continue-on-error: true

      - name: Test with Gradle
        run: ./gradlew test
        working-directory: extensions/trainz-idea
        continue-on-error: true

      - name: Create archive
        run: |
          mkdir -p artifacts
          tar -czf artifacts/trainz-idea-${{ github.sha }}.tar.gz build/distributions/
        working-directory: extensions/trainz-idea
        if: always()

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jetbrains-build
          path: extensions/trainz-idea/artifacts/
          retention-days: 30
        if: always()
