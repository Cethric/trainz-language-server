name: VSCode Extension Build

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'extensions/vscode/**'
      - '.github/workflows/vscode-extension-build.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'extensions/vscode/**'
      - '.github/workflows/vscode-extension-build.yml'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        node: [ '20', '22' ]
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'
          cache-dependency-path: 'extensions/vscode/pnpm-lock.yaml'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: extensions/vscode

      - name: Build
        run: pnpm build
        working-directory: extensions/vscode

      - name: Lint
        run: pnpm lint
        working-directory: extensions/vscode
        continue-on-error: true

      #      - name: Run tests
      #        run: |
      #          mkdir -p test-results
      #          pnpm test
      #        working-directory: extensions/vscode
      #        env:
      #          MOCHA_REPORTER: mocha-junit-reporter
      #          MOCHA_REPORTER_OPTIONS: '{"mochaFile":"./test-results/vscode-test-results.xml","testsuitesTitle":"VSCode Extension Tests","useFullSuiteTitle":"true"}'
      #
      #      - name: Publish VSCode test dashboard
      #        uses: ctrf-io/github-test-reporter@v1
      #        with:
      #          report-path: 'extensions/vscode/test-results/*.xml'
      #          summary-report: true
      #          failed-report: true
      #          test-report: true
      #          insights-report: true
      #          status-check: true
      #          upload-artifact: true
      #          report-order: 'summary-report,failed-report,insights-report,test-report'
      #        env:
      #          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      #        if: always()

      - name: Create archive
        run: |
          mkdir -p artifacts
          tar -C out -czf artifacts/trainz-language-server-vscode-${{ matrix.os }}-node${{ matrix.node }}-${{ github.sha }}.tar.gz .
        working-directory: extensions/vscode
        if: success()

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vscode-build-${{ matrix.os }}-node${{ matrix.node }}
          path: extensions/vscode/artifacts/
          retention-days: 30
        if: success()
