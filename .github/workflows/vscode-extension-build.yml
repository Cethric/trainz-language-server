name: VSCode Extension Build

on:
  push:
    branches: [main, develop]
    paths:
      - 'extensions/vscode/**'
      - '.github/workflows/vscode-extension-build.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'extensions/vscode/**'
      - '.github/workflows/vscode-extension-build.yml'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'
          cache-dependency-path: 'extensions/vscode/pnpm-lock.yaml'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: extensions/vscode

      - name: Build
        run: pnpm build
        working-directory: extensions/vscode

      - name: Lint
        run: pnpm lint
        working-directory: extensions/vscode
        continue-on-error: true

      - name: Type check
        run: pnpm typecheck
        working-directory: extensions/vscode
        continue-on-error: true

      - name: Create archive
        run: |
          mkdir -p artifacts
          tar -czf artifacts/trainz-lsp-vscode-${{ matrix.os }}-node${{ matrix.node }}-${{ github.sha }}.tar.gz out/
        working-directory: extensions/vscode
        if: success()

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vscode-build-${{ matrix.os }}-node${{ matrix.node }}
          path: extensions/vscode/artifacts/
          retention-days: 30
        if: success()
