[workspace]
members = [
    "crates/ast",
    "crates/common",
    "crates/formatter",
    "crates/formatter-cli",
    "crates/diagnostics",
    "crates/formatter",
    "crates/lsp",
    "crates/parser",
    "crates/formatter-cli",
    "crates/ast",
    "crates/common",
    "crates/semantic-tokens",
    "crates/symboliser",
    "crates/completions",
    "crates/folding",
    "crates/hover",
    "crates/definition",
    "crates/util"
]
resolver = "3"

[workspace.package]
edition = "2024"

[workspace.dependencies]
shadow-rs = { version = "1.7", default-features = false }
tokio = { version = "1.51", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = [] }
bson = { version = "3.1", features = ["chrono-0_4", "serde"] }
sha2 = { version = "0.11", features = [] }
hex = { version = "0.4", features = [] }
thiserror = { version = "2.0", features = [] }
anyhow = { version = "1.0", features = [] }
log = { version = "0.4", features = [] }
env_logger = { version = "0.11", features = ["auto-color"] }
async-trait = { version = "0.1", features = [] }
rayon = { version = "1.11", features = [] }
chrono = { version = "0.4", features = ["serde"] }

pest = { version = "2.8", features = ["pretty-print"] }
tower-lsp-server = { version = "0.23", features = [] }

clap = { version = "4.6", features = ["derive", "env"] }
clio = { version = "0.3", features = ["clap-parse"] }
clap-verbosity-flag = { version = "3.0.4", features = ["serde"] }

gs-ast = { path = "crates/ast" }
gs-common = { path = "crates/common" }
gs-parser = { path = "crates/parser" }
gs-formatter = { path = "crates/formatter" }
gs-diagnostics = { path = "crates/diagnostics" }
gs-semantic-tokens = { path = "crates/semantic-tokens" }
gs-symboliser = { path = "crates/symboliser" }
gs-completions = { path = "crates/completions" }
gs-folding = { path = "crates/folding" }
gs-definition = { path = "crates/definition" }
gs-util = { path = "crates/util" }
